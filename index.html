<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funciograma · Blue Star Group México</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F0F4; --card:#FFFFFF; --ink:#191A2C; --muted:#6B6A80;
  --line:#DBD9E4; --line-soft:#EAE8F0; --accent:#C8146B; --blue:#2A3DA8; --chip:#ECEAF2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131320; --card:#1C1C2B; --ink:#EDECF3; --muted:#9B99AE;
    --line:#323246; --line-soft:#262636; --chip:#26263A; --accent:#FF5FA2; --blue:#8FA0FF;
  }
}
:root[data-theme="dark"]{
  --paper:#131320; --card:#1C1C2B; --ink:#EDECF3; --muted:#9B99AE;
  --line:#323246; --line-soft:#262636; --chip:#26263A; --accent:#FF5FA2; --blue:#8FA0FF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Public Sans","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num,.pers,.big{font-family:"Bricolage Grotesque","Public Sans",Helvetica,Arial,sans-serif}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px 90px}

header.top{padding:32px 0 0}
.eyebrow{color:var(--muted);font-size:14px;margin:0}
h1{font-size:clamp(27px,4.2vw,42px);font-weight:800;letter-spacing:-.02em;margin:0 0 7px}
.lede{color:var(--muted);max-width:66ch;margin:0}

/* ---------- hojas ---------- */
.hojas{display:flex;gap:4px;margin-top:26px;border-bottom:2px solid var(--line)}
.hojas button{
  border:1px solid var(--line);border-bottom:0;background:transparent;color:var(--muted);
  font:inherit;font-size:14.5px;padding:11px 20px;border-radius:10px 10px 0 0;cursor:pointer;
  margin-bottom:-2px;
}
.hojas button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;border-color:var(--line);box-shadow:0 2px 0 var(--card)}
.hojas button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.hoja[hidden]{display:none}

.plantilla{margin:26px 0 4px}
.bar{display:flex;width:100%;height:46px;border-radius:8px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.bar button{border:0;padding:0;cursor:pointer;color:#fff;font:inherit;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;min-width:6px;transition:filter .15s ease,opacity .15s ease}
.bar button:hover{filter:brightness(1.12)}
.bar button.dim{opacity:.28}
.bar button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.legend button{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font:inherit;font-size:13px}
.legend .dot{width:9px;height:9px;border-radius:50%}
.legend .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.legend button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.controls{position:sticky;top:0;z-index:30;background:var(--paper);padding:14px 0 12px;margin-top:22px;border-bottom:1px solid var(--line)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;padding:11px 38px 11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;line-height:1}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost.icono{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center}
.ghost.icono svg{width:19px;height:19px;display:block}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:13px;margin:10px 0 0}

.area{position:relative;margin-top:34px;scroll-margin-top:112px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 24px 14px;overflow:hidden}
.area::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--a)}
.area-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:30px 0 16px;border-bottom:2px solid var(--line)}
.area-head h2{font-size:clamp(20px,2.6vw,28px);font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.1}
.area-head .sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.headcount{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.headcount .num{font-size:clamp(52px,9vw,80px);font-weight:800;line-height:.82;letter-spacing:-.045em;color:var(--a);font-variant-numeric:tabular-nums}
.headcount .lbl{font-size:13.5px;color:var(--muted);max-width:68px;line-height:1.15}

.thead,.row{display:grid;gap:18px}
.v-jer .thead,.v-jer .row{grid-template-columns:2.3fr 78px 2fr 2fr}
.v-area .thead,.v-area .row{grid-template-columns:1.5fr 74px 1.25fr 1.1fr 1.75fr 1.75fr}
.thead{padding:14px 2px 10px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.row{width:calc(100% + 20px);margin:0 -10px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft);padding:14px 10px;cursor:pointer;color:inherit;font:inherit;border-radius:8px;align-items:start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--chip)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[hidden]{display:none}

.tcell{position:relative;padding-left:calc(var(--d) * 26px);display:flex;gap:8px;align-items:flex-start}
.elbow{position:absolute;left:calc(var(--d) * 26px - 17px);top:2px;width:13px;height:11px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:5px}
.caret{flex:0 0 auto;width:20px;height:20px;margin-top:1px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:5px;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.caret:hover{border-color:var(--a);color:var(--a)}
.nocaret{flex:0 0 auto;width:20px}
.puesto{font-weight:600;font-size:15px;line-height:1.3}
.v-jer .row[data-d="0"] .puesto{font-size:16.5px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.quien{color:var(--muted);font-size:12.8px;margin-top:4px}
.jefe{color:var(--muted);font-size:12.2px;margin-top:4px}
.reporta{font-size:13px;color:var(--muted);line-height:1.45}
.team{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--a);background:var(--chip);border-radius:999px;padding:2px 9px}
.pers{font-weight:800;font-size:27px;line-height:1;color:var(--a);font-variant-numeric:tabular-nums}
.pers small{display:block;font-family:"Public Sans",sans-serif;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.gente{font-size:13px;color:var(--ink);line-height:1.45}
.gente div{padding:1px 0}
.mas{margin-top:3px;border:0;background:transparent;color:var(--a);font:inherit;font-size:12.5px;font-weight:600;padding:0;cursor:pointer;text-align:left}
.mas:hover{text-decoration:underline}
.txt{font-size:13.3px;color:var(--ink);line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
mark{background:rgba(200,20,107,.2);color:inherit;border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:60px 0}

/* ---------- hoja: ficha de puesto ---------- */
.picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 6px}
.picker select{
  flex:1 1 340px;padding:13px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;
}
.picker select:focus{outline:2px solid var(--accent);outline-offset:1px}
.picker .hint{color:var(--muted);font-size:13px;flex-basis:100%;margin:0}
.ficha-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 34px 40px;margin-top:18px;overflow:hidden}
.ficha-card::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--a)}
.ficha-card .kicker{color:var(--a);font-size:13px;font-weight:600;margin:32px 0 6px}
.ficha-card h3{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em;margin:0 0 20px;max-width:24ch}
.meta{display:flex;gap:34px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta .big{font-size:46px;font-weight:800;line-height:.9;color:var(--a);font-variant-numeric:tabular-nums}
.meta .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.meta .v{font-size:15px;font-weight:600}
.link{color:var(--blue);background:transparent;border:0;border-bottom:1px solid currentColor;padding:0;font:inherit;font-weight:600;cursor:pointer}
.link:hover{color:var(--a)}
.block{margin-top:28px}
.block h4{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 9px}
.block p{margin:0;max-width:70ch;font-size:15.5px}
.people{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px}
.people li{background:var(--chip);border-radius:7px;padding:8px 12px;font-size:14px}
.equipo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:7px}
.equipo button{width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.equipo button:hover{border-color:var(--a);color:var(--a)}
.equipo .n{color:var(--muted);font-size:12.5px;white-space:nowrap}
.resp{margin:0;padding:0;list-style:none;counter-reset:r}
.resp li{counter-increment:r;position:relative;padding:11px 0 11px 36px;border-top:1px solid var(--line-soft);font-size:15px;max-width:74ch}
.resp li:first-child{border-top:0}
.resp li::before{content:counter(r);position:absolute;left:0;top:11px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;color:var(--a);font-variant-numeric:tabular-nums}

@media (max-width:1080px){
  .thead{display:none}
  .area{padding:0 16px 10px}
  .v-jer .row,.v-area .row{grid-template-columns:1fr 66px;gap:8px 12px;padding:14px 8px;width:calc(100% + 16px);margin:0 -8px}
  .txt,.gente,.reporta{grid-column:1 / -1}
  .txt{-webkit-line-clamp:3}
  .txt::before,.gente::before,.reporta::before{content:attr(data-k);display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .tcell{padding-left:calc(var(--d) * 18px)}
  .elbow{left:calc(var(--d) * 18px - 13px)}
  .ficha-card{padding:0 18px 32px}
  .hojas button{padding:10px 14px;font-size:13.5px}
}
@media print{.controls,.plantilla,.hojas{display:none!important}.row{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Funciograma</h1>
    <p class="eyebrow">Blue Star Group México · Todo Moda · Isadora</p>
    <div class="hojas" role="tablist" aria-label="Hojas">
      <button role="tab" id="tab-func" aria-controls="hoja-func" aria-selected="true">Funciograma</button>
      <button role="tab" id="tab-ficha" aria-controls="hoja-ficha" aria-selected="false">Ficha de puesto</button>
    </div>
  </header>

  <!-- ================= HOJA 1 ================= -->
  <section class="hoja" id="hoja-func" role="tabpanel" aria-labelledby="tab-func">
    <div class="plantilla">
      <div class="bar" id="bar" role="group" aria-label="Plantilla por área"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="controls">
      <div class="ctl">
        <div class="seg" id="vista" role="group" aria-label="Forma de ver la estructura">
          <button type="button" data-v="area" aria-pressed="true">Por área</button>
          <button type="button" data-v="jer" aria-pressed="false">Organigrama</button>
        </div>
        <div class="search">
          <input id="q" type="search" placeholder="Buscar puesto o persona…" autocomplete="off" aria-label="Buscar">
          <button class="clear" id="clear" aria-label="Borrar búsqueda" hidden>&times;</button>
        </div>
        <button class="ghost" id="reset">Ver todo</button>
        <button class="ghost icono" id="theme" aria-label="Cambiar a modo oscuro" title="Cambiar tema"></button>
      </div>
      <p class="count" id="count"></p>
    </div>

    <div id="list"></div>
  </section>

  <!-- ================= HOJA 2 ================= -->
  <section class="hoja" id="hoja-ficha" role="tabpanel" aria-labelledby="tab-ficha" hidden>
    <div class="picker">
      <select id="sel" aria-label="Elige un puesto"></select>
      <button class="ghost" id="prev">Anterior</button>
      <button class="ghost" id="next">Siguiente</button>
      <p class="hint">Elige un puesto y la ficha se arma con la información del descriptor oficial.</p>
    </div>
    <div class="ficha-card" id="ficha"></div>
  </section>
</div>

<script>
const DATA = {"areas":[{"nombre":"Country manager","puestos":1,"personas":1},{"nombre":"Administración y finanzas","puestos":23,"personas":42},{"nombre":"Capital humano","puestos":14,"personas":24},{"nombre":"Operaciones retail","puestos":4,"personas":23},{"nombre":"Brand management","puestos":9,"personas":13},{"nombre":"Logística","puestos":3,"personas":3},{"nombre":"Arquitectura y mantenimiento","puestos":3,"personas":6},{"nombre":"Locaciones","puestos":1,"personas":1}],"puestos":[{"area":"Country manager","puesto":"Country manager","personas":1,"reporta":"Casa Matriz / corporativo","resumen":"Máxima posición ejecutiva de la operación en México, responsable de dirigir el negocio hacia el cumplimiento de sus objetivos financieros y operativos, en línea con la estrategia global de la compañía.","objetivo":"Dirigir, orientar y controlar las actividades de la organización en México para la consecución de sus objetivos financieros y operativos a corto y largo plazo, conforme a la estrategia y el plan de negocios global de la empresa.","nombres":["Maria Josefina Cal"],"resp":["Dirigir todos los aspectos de las operaciones diarias de la organización para asegurar la eficiencia y el cumplimiento de objetivos.","Definir las estrategias locales e implementar los procedimientos para alcanzar las metas de costos, rentabilidad y calidad de servicio.","Seleccionar anualmente las compras a realizar para el mercado con base en las colecciones definidas por Casa Matriz.","Desarrollar y liderar a su equipo, asegurando las competencias necesarias para la implementación de las estrategias definidas.","Liderar el Business Team local para garantizar los niveles de servicio requeridos.","Gestionar todas las operaciones locales conforme a los valores, código de conducta y regulaciones legales locales.","Definir y liderar los procesos de apertura de tiendas en el mercado.","Ser referente y promover la cultura y los valores de la organización.","Representar a la compañía ante autoridades, cámaras empresariales y centros comerciales del mercado.","Dar seguimiento a los indicadores financieros y operativos del país, reportando resultados a Casa Matriz."]},{"area":"Administración y finanzas","puesto":"Director administración y finanzas","personas":1,"reporta":"Country manager","resumen":"Máxima posición del área de Finanzas, responsable de la estrategia financiera integral de la compañía y de brindar a la Dirección General la información y el análisis necesarios para el crecimiento rentable y sostenible del negocio.","objetivo":"Liderar la estrategia financiera de la compañía y brindar a la Dirección General información y análisis oportunos para la toma de decisiones, a través de la planeación del presupuesto, la evaluación de fuentes de financiamiento y el uso de herramientas de analítica avanzada, para garantizar el crecimiento rentable y sostenible de la empresa.","nombres":["Erik Ovilla Jaimes"],"resp":["Definir y liderar la estrategia financiera de mediano y largo plazo de la compañía (presupuesto – plan de negocio).","Garantizar el abastecimiento de recursos y servicios indirectos necesarios para la operación, de acuerdo con las políticas de compras establecidas.","Proveer información estratégica a la Dirección General para la toma de decisiones, y a las demás áreas para el seguimiento del negocio (KPI's), mediante herramientas de analítica de datos e IA.","Anticipar, en función de las proyecciones financieras, las necesidades de recursos con la finalidad de garantizar la operación y el crecimiento del negocio.","Gestionar y garantizar las fuentes de financiamiento de mediano y largo plazo de acuerdo con las necesidades del negocio.","Definir y asegurar el cumplimiento de políticas que protejan la integridad de los activos de la compañía (seguridad patrimonial, inventarios y pólizas de seguros) y el control interno.","Identificar, analizar y comunicar los riesgos financieros y operativos a los que está expuesta la compañía, y liderar el diseño de const COLORS = ["#C8146B","#2A3DA8","#118A7E","#D2601A","#7A2FA8","#1F7BC4","#B0154A","#3F7A2E","#4A5568"];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const P = DATA.puestos;
const byName = {};
P.forEach((p,i)=>{ p.idx=i; byName[norm(p.puesto)]=i; });
const areaColor = {}; DATA.areas.forEach((a,i)=>areaColor[a.nombre]=COLORS[i%COLORS.length]);
const areaId = n => "area-"+norm(n).replace(/[^a-z0-9]+/g,"-");

P.forEach(p => { const b = byName[norm(p.reporta)]; p.boss = (b===undefined||b===p.idx) ? null : b; });
const kids = {};
P.forEach(p => { if (p.boss !== null && P[p.boss].area === p.area) (kids[p.boss] = kids[p.boss] || []).push(p.idx); });
const rootsOf = a => P.filter(p => p.area === a && (p.boss === null || P[p.boss].area !== a)).map(p => p.idx);
const acargo = i => (kids[i]||[]).reduce((s,c)=>s+P[c].personas+acargo(c),0);
P.forEach(p => { p.equipo = acargo(p.idx); });

let q = "", areaSel = null, colapsados = new Set(), vista = "area", actual = 0;

/* ================= hojas ================= */
const tabs = {func:[document.getElementById("tab-func"), document.getElementById("hoja-func")],
              ficha:[document.getElementById("tab-ficha"), document.getElementById("hoja-ficha")]};
function irAHoja(k){
  Object.keys(tabs).forEach(x => {
    tabs[x][0].setAttribute("aria-selected", String(x===k));
    tabs[x][1].hidden = (x!==k);
  });
}
tabs.func[0].onclick = ()=>irAHoja("func");
tabs.ficha[0].onclick = ()=>irAHoja("ficha");

/* ================= barra de plantilla ================= */
const bar = document.getElementById("bar"), legend = document.getElementById("legend");
const total = DATA.areas.reduce((s,a)=>s+a.personas,0);
DATA.areas.forEach(a => {
  const b = document.createElement("button");
  b.style.flex = a.personas+" 1 0"; b.style.background = areaColor[a.nombre];
  b.title = a.nombre+" · "+a.personas+" personas";
  b.textContent = a.personas >= 6 ? a.personas : "";
  b.setAttribute("aria-label", a.nombre+", "+a.personas+" personas");
  b.onclick = ()=>toggleArea(a.nombre);
  bar.appendChild(b);
  const l = document.createElement("button");
  l.setAttribute("aria-pressed","false");
  l.innerHTML = '<span class="dot" style="background:'+areaColor[a.nombre]+'"></span>'+esc(a.nombre)+' <span class="n">'+a.personas+'</span>';
  l.onclick = ()=>toggleArea(a.nombre);
  legend.appendChild(l);
});
function toggleArea(n){
  areaSel = (areaSel===n) ? null : n;
  render();
  if (areaSel){ const el = document.getElementById(areaId(areaSel)); if (el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
}

/* ================= hoja 1: funciograma ================= */
const list = document.getElementById("list"), countEl = document.getElementById("count");
function highlight(t){
  const s = esc(t); if (!q) return s;
  const i = norm(s).indexOf(norm(q)); if (i<0) return s;
  return s.slice(0,i)+"<mark>"+s.slice(i,i+q.length)+"</mark>"+s.slice(i+q.length);
}
function match(p){
  if (areaSel && p.area !== areaSel) return false;
  if (!q) return true;
  const n = norm(q);
  return norm(p.puesto).includes(n) || norm(p.reporta).includes(n) || norm(p.area).includes(n)
      || p.nombres.some(x=>norm(x).includes(n)) || norm(p.resumen).includes(n) || norm(p.objetivo).includes(n);
}
function activable(el, idx){
  el.setAttribute("role","button"); el.tabIndex = 0;
  el.addEventListener("click", e => { if (!e.target.closest(".mas,.caret")) verFicha(idx); });
  el.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); verFicha(idx); } });
}

function filaArea(p){
  const el = document.createElement("div");
  el.className = "row"; el.dataset.id = p.idx;
  const vis = p.nombres.map(n=>'<div>'+highlight(n)+'</div>').join("");

    '<div><div class="puesto">'+highlight(p.puesto)+'</div>'
      + (p.equipo ? '<span class="team">'+p.equipo+' a su cargo</span>' : "")+'</div>'
    + '<div class="pers">'+p.personas+'<small>'+(p.personas===1?"persona":"personas")+'</small></div>'
    + '<div class="gente" data-k="Nombre completo">'+vis+'</div>'
    + '<div class="reporta" data-k="Reporta a">'+highlight(p.reporta)+'</div>'
    + '<div class="txt" data-k="Resumen del puesto">'+esc(p.resumen)+'</div>'
    + '<div class="txt" data-k="Objetivo general">'+esc(p.objetivo)+'</div>';
  activable(el, p.idx);
  return el;
}

function filaJer(p, d, conHijos){
  const el = document.createElement("div");
  el.className = "row"; el.dataset.d = d; el.dataset.id = p.idx;
  el.style.setProperty("--d", d);
  if (p.boss !== null) el.dataset.parent = p.boss;
  const quien = p.nombres.length <= 2 ? p.nombres.join(" · ")
    : p.nombres.slice(0,2).join(" · ")+" · +"+(p.nombres.length-2)+" más";
  const jefeFuera = (p.boss !== null && P[p.boss].area !== p.area)
    ? '<div class="jefe">Reporta a '+esc(p.reporta)+' · '+esc(P[p.boss].area)+'</div>' : "";
  el.innerHTML =
    '<div class="tcell">'
      + (d>0 ? '<span class="elbow"></span>' : "")
      + (conHijos ? '<button class="caret" type="button" aria-expanded="true" aria-label="Mostrar u ocultar el equipo">&minus;</button>' : '<span class="nocaret"></span>')
      + '<div><div class="puesto">'+highlight(p.puesto)+'</div>'
      + '<div class="quien">'+highlight(quien)+'</div>'+jefeFuera
      + (p.equipo ? '<span class="team">'+p.equipo+' a su cargo</span>' : "")
      + '</div></div>'
    + '<div class="pers">'+p.personas+'<small>'+(p.personas===1?"persona":"personas")+'</small></div>'
    + '<div class="txt" data-k="Resumen del puesto">'+esc(p.resumen)+'</div>'
    + '<div class="txt" data-k="Objetivo general">'+esc(p.objetivo)+'</div>';
  const car = el.querySelector(".caret");
  if (car) car.onclick = e => { e.stopPropagation(); plegar(p.idx); };
  activable(el, p.idx);
  return el;
}

function plegar(id){ colapsados.has(id) ? colapsados.delete(id) : colapsados.add(id); aplicarPliegue(); }
function aplicarPliegue(){
  document.querySelectorAll("#list .row").forEach(r => {
    let padre = r.dataset.parent, oculto = false, guard = 0;
    while (padre !== undefined && guard++ < 20){
      const pid = +padre;
      if (colapsados.has(pid)){ oculto = true; break; }
      const pr = document.querySelector('#list .row[data-id="'+pid+'"]');
      if (!pr) break;
      padre = pr.dataset.parent;
    }
    r.hidden = oculto;
    const c = r.querySelector(".caret");
    if (c){
      const cerrado = colapsados.has(+r.dataset.id);
      c.innerHTML = cerrado ? "+" : "&minus;";
      c.setAttribute("aria-expanded", String(!cerrado));
    }
  });
}

function render(){
  const shown = P.filter(match);
  const vivos = new Set(shown.map(p=>p.idx));
  list.innerHTML = "";
  document.querySelectorAll("#bar button").forEach((b,i)=>b.classList.toggle("dim", !!areaSel && DATA.areas[i].nombre!==areaSel));
  document.querySelectorAll("#legend button").forEach((b,i)=>b.setAttribute("aria-pressed", String(areaSel===DATA.areas[i].nombre)));
  if (!shown.length){
    list.innerHTML = '<p class="empty">Sin resultados para “'+esc(q)+'”. Prueba con otro puesto o nombre.</p>';
    countEl.textContent = "0 puestos";
    return;
  }
  let areasVistas = 0;
  DATA.areas.forEach(a => {
    const enArea = shown.filter(p => p.area === a.nombre);
    if (!enArea.length) return;
    areasVistas++;
    const personas = enArea.reduce((s,p)=>s+p.personas,0);
    const sec = document.createElement("section");
    sec.className = "area " + (vista==="jer" ? "v-jer" : "v-area");
    sec.id = areaId(a.nombre);
    sec.style.setProperty("--a", areaColor[a.nombre]);
    sec.innerHTML =
      '<div class="area-head"><div><h2>'+esc(a.nombre)+'</h2><div class="sub">'
      + enArea.length + (enArea.length===1?" puesto":" puestos")
      + (enArea.length!==a.puestos ? " de "+a.puestos : "")+'</div></div>'
      + '<div class="headcount"><span class="num">'+personas+'</span><span class="lbl">'
      + (personas===1?"persona":"personas")+'</span></div></div>'
      + (vista==="jer"
          ? '<div class="thead"><div>Puesto y equipo</div><div>Personas</div><div>Resumen del puesto</div><div>Objetivo general</div></div>'
          : '<div class="thead"><div>Puesto</div><div>Personas</div><div>Nombre completo</div><div>Reporta a</div><div>Resumen del puesto</div><div>Objetivo general</div></div>');
    if (vista === "area"){
      enArea.forEach(p => sec.appendChild(filaArea(p)));
    } else if (q){
      enArea.forEach(p => sec.appendChild(filaJer(p, 0, false)));
    } else {
      const pinta = (i,d) => {
        const hijos = (kids[i]||[]).filter(c=>vivos.has(c));
        sec.appendChild(filaJer(P[i], d, hijos.length>0));
        hijos.forEach(c=>pinta(c,d+1));
      };
      rootsOf(a.nombre).filter(i=>vivos.has(i)).forEach(i=>pinta(i,0));
    }
    list.appendChild(sec);
  });
  const personasTot = shown.reduce((s,p)=>s+p.personas,0);
  countEl.textContent = shown.length+" puestos · "+personasTot+" personas · "+areasVistas
    + (areasVistas===1?" área":" áreas")
    + ((q||areaSel) ? "  (de "+P.length+" puestos y "+total+" personas)" : "");
  aplicarPliegue();
}

/* ================= hoja 2: ficha de puesto ================= */
const sel = document.getElementById("sel"), fichaEl = document.getElementById("ficha");
DATA.areas.forEach(a => {
  const g = document.createElement("optgroup"); g.label = a.nombre;
  P.filter(p => p.area === a.nombre).forEach(p => {
    const o = document.createElement("option");
    o.value = p.idx; o.textContent = p.puesto + "  (" + p.personas + ")";
    g.appendChild(o);
  });
  sel.appendChild(g);
});

function pintarFicha(i){
  actual = i;
  const p = P[i];
  sel.value = i;
  fichaEl.style.setProperty("--a", areaColor[p.area]);
  const directos = P.filter(x => x.boss === i).map(x => x.idx);
  fichaEl.innerHTML =
    '<p class="kicker">'+esc(p.area)+'</p>'
    + '<h3>'+esc(p.puesto)+'</h3>'
    + '<div class="meta">'
      + '<div><div class="k">Personas en el puesto</div><div class="big">'+p.personas+'</div></div>'
      + (p.equipo ? '<div><div class="k">Personas a su cargo</div><div class="big">'+p.equipo+'</div></div>' : "")
      + '<div><div class="k">Reporta a</div><div class="v">'
        + (p.boss !== null ? '<button class="link" data-go="'+p.boss+'" type="button">'+esc(p.reporta)+'</button>' : esc(p.reporta))
      + '</div></div>'
    + '</div>'
    + '<div class="block"><h4>Resumen del puesto</h4><p>'+esc(p.resumen)+'</p></div>'
    + '<div class="block"><h4>Objetivo general</h4><p>'+esc(p.objetivo)+'</p></div>'
    + (directos.length ? '<div class="block"><h4>Reportes directos</h4><ul class="equipo">'
        + directos.map(c=>'<li><button data-go="'+c+'" type="button"><span>'+esc(P[c].puesto)
          +'</span><span class="n">'+P[c].personas+(P[c].personas===1?" persona":" personas")+'</span></button></li>').join("")
        +'</ul></div>' : "")
    + '<div class="block"><h4>'+(p.nombres.length===1?"Persona en el puesto":"Personas en el puesto")+'</h4>'
      + '<ul class="people">'+p.nombres.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul></div>'
    + '<div class="block"><h4>Responsabilidades formales</h4><ul class="resp">'
      + p.resp.map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul></div>';
  fichaEl.querySelectorAll("[data-go]").forEach(b => b.onclick = () => pintarFicha(+b.dataset.go));
}
function verFicha(i){ irAHoja("ficha"); pintarFicha(i); window.scrollTo({top:0,behavior:"smooth"}); }
sel.onchange = () => pintarFicha(+sel.value);
document.getElementById("prev").onclick = () => pintarFicha((actual - 1 + P.length) % P.length);
document.getElementById("next").onclick = () => pintarFicha((actual + 1) % P.length);

/* ================= controles ================= */
const input = document.getElementById("q"), clear = document.getElementById("clear");
input.addEventListener("input", ()=>{ q = input.value.trim(); clear.hidden = !q; render(); });
clear.onclick = ()=>{ input.value=""; q=""; clear.hidden=true; input.focus(); render(); };
document.querySelectorAll("#vista button").forEach(b => {
  b.onclick = () => {
    vista = b.dataset.v;
    document.querySelectorAll("#vista button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    render();
  };
});
document.getElementById("reset").onclick = ()=>{
  input.value=""; q=""; clear.hidden=true; areaSel=null;
  colapsados=new Set();
  render(); window.scrollTo({top:0,behavior:"smooth"});
};
const themeBtn = document.getElementById("theme");
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.3M12 19.3v2.3M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6'
  + 'M2.4 12h2.3M19.3 12h2.3M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>';
const LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/></svg>';
function temaActual(){
  const cur = document.documentElement.getAttribute("data-theme");
  return cur ? cur : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function pintarTema(){
  const oscuro = temaActual() === "dark";
  themeBtn.innerHTML = oscuro ? SOL : LUNA;
  themeBtn.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
}
themeBtn.onclick = ()=>{
  const next = temaActual() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("fg-theme", next); }catch(e){}
  pintarTema();
};
try{ const t = localStorage.getItem("fg-theme"); if (t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
pintarTema();

render();
pintarFicha(0);
</script>
</body>
</html>
